name: Verify iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run unit tests
        run: flutter test
      - name: Compile iOS without code signing
        run: flutter build ios --release --no-codesign
