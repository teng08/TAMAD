name: Verify Android APK installation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag
        required: true
        type: string
      apk_name:
        description: APK asset name
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 of the APK
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 30, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Download release APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_NAME: ${{ inputs.apk_name }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          curl --fail --location --retry 3 \
            --output tamad.apk \
            "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$APK_NAME"
          printf '%s  %s\n' "$EXPECTED_SHA256" tamad.apk | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: |
            adb install -r tamad.apk
            adb shell pm path com.tamad.tamad
            adb shell am start -n com.tamad.tamad/.MainActivity
            sleep 15
            adb shell pidof com.tamad.tamad
