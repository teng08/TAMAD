name: Verify ARM64 Android APK package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag
        required: true
        type: string
      apk_name:
        description: ARM64 APK asset name
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 of the APK
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      APK_NAME: ${{ inputs.apk_name }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact published APK and check SHA-256
        run: |
          curl --fail --location --retry 3 \
            --output tamad-arm64.apk \
            "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$APK_NAME"
          printf '%s  %s\n' "$EXPECTED_SHA256" tamad-arm64.apk | sha256sum --check
          unzip -tq tamad-arm64.apk > /dev/null
      - name: Check Android signature, package, and ARM64 ABI
        run: |
          sdkmanager --install 'build-tools;36.0.0' > /dev/null
          SIGNATURE="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs tamad-arm64.apk)"
          printf '%s\n' "$SIGNATURE"
          printf '%s\n' "$SIGNATURE" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging tamad-arm64.apk)"
          printf '%s\n' "$BADGING" | grep -E '^(package:|sdkVersion:|native-code:)'
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.tamad.tamad'"
          printf '%s\n' "$BADGING" | grep -Fq "versionName='${RELEASE_TAG#v}'"
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'24'"
          printf '%s\n' "$BADGING" | grep -Fxq "native-code: 'arm64-v8a'"
